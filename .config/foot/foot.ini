[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+c XF86Copy
primary-paste=none
# Ctrl+v is left raw (^V) so Claude Code sees it and can paste clipboard
# images; foot's paste is text-only. .bashrc binds ^V to paste text in the shell.
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Ctrl+c copies (swapped above), so send the original ^C on Ctrl+Shift+c.
\x03=Control+Shift+c
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Ctrl+Backspace: send Ctrl+W's code (readline's unix-word-rubout) so it
# deletes the previous word instead of being indistinguishable from Backspace.
\x17=Control+BackSpace

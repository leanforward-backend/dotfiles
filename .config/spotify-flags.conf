# Read by /usr/bin/spotify at launch (one flag per line, # for comments).
# The scale line is rewritten by the UI Scale bar widget; other lines are kept.
# GPU workaround: hybrid Intel Arc + NVIDIA under XWayland fails Ozone GL
# interop, which renders video (and sometimes the whole window) white.
--disable-gpu-compositing
--force-device-scale-factor=1.05
